<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Hradecký úklid, Hradec Králové">
  <defs>
    <path id="obvod-horni" d="M70,70 m-52,0 a52,52 0 1 1 104,0" fill="none"/>
    <path id="obvod-dolni" d="M70,70 m52,0 a52,52 0 0 1 -104,0" fill="none"/>
  </defs>
  <!-- pečeť: důvěryhodnost servisní firmy, funguje jako razítko i samolepka na dodávku -->
  <circle cx="70" cy="70" r="66" fill="none" stroke="#0B3049" stroke-width="3"/>
  <circle cx="70" cy="70" r="59" fill="none" stroke="#177A8D" stroke-width="1.5"/>
  <text font-family="Bricolage Grotesque, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#0B3049" letter-spacing="2.6">
