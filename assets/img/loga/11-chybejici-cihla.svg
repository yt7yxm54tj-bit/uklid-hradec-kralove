<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Hradecký úklid">
  <defs>
  </defs>
  <!-- vazba, ze které je jedna cihla odebraná — my nepřidáváme, my odebíráme -->
  <g fill="#0B3049">
    <rect x="10" y="12" width="21" height="9.5" rx="2"/>
    <rect x="34" y="12" width="21" height="9.5" rx="2"/>
    <rect x="10" y="24.5" width="9" height="9.5" rx="2"/>
    <rect x="21" y="24.5" width="20" height="9.5" rx="2"/>
    <rect x="10" y="37" width="21" height="9.5" rx="2"/>
    <rect x="34" y="37" width="21" height="9.5" rx="2"/>
    <rect x="10" y="49.5" width="9" height="9.5" rx="2"/>
    <rect x="22" y="49.5" width="21" height="9.5" rx="2"/>
    <rect x="46" y="49.5" width="9" height="9.5" rx="2"/>
  </g>
  <!-- odebraná cihla: po ní zbylo čisté prázdno, tenký teal obrys ho drží čitelné i v malém -->
  <rect x="44" y="24.5" width="13" height="9.5" rx="2" fill="none" stroke="#177A8D" stroke-width="2"/>
  <text x="76" y="42" font-family="Bricolage Grotesque, Inter, sans-serif" font-size="30" font-weight="600" fill="#0B3049" letter-spacing="-0.6">Hradecký</text>
  <text x="218" y="42" font-family="Bricolage Grotesque, Inter, sans-serif" font-size="30" font-weight="700" fill="#177A8D" letter-spacing="-0.6">úklid</text>
</svg>
